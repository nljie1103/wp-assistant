<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>v3.0.2 顶部导航 · 真正窄屏 iframe 验收</title>
<style>
body{font:13px/1.5 system-ui;margin:12px;background:#edf0f3;color:#171717}
#readout{white-space:pre-wrap;background:#fff;padding:12px;border:1px solid #dedede;border-radius:8px}
iframe{width:430px;max-width:100%;height:800px;display:block;margin:8px 0;border:2px solid #ccc;background:white}
</style></head>
<body>
<h1 style="font-size:18px">窄屏横向导航 · 430px</h1>
<pre id="readout">正在读取 iframe 视口的实际布局...</pre>
<iframe id="phone" src="./v3-dashboard.html?frame=mobile" title="真实 430px viewport"></iframe>
<script>
const frame=document.getElementById('phone'), out=document.getElementById('readout');
function verify(){
  try{
    const d=frame.contentDocument, win=frame.contentWindow;
    const nav=d.querySelector('.jlwa-ui-horizontal-nav');
    const links=nav.querySelectorAll('a');
    const app=d.querySelector('.jlwa-v3');
    const content=d.querySelector('.jlwa-v3-workspace');
    const top=d.getElementById('jlwa-vue-topnav');
    const results={
      viewport: win.innerWidth,
      navCount: links.length,
      navScrolls:nav.scrollWidth>nav.clientWidth,
      navScrollWidth:nav.scrollWidth,
      navClientWidth:nav.clientWidth,
      topBeforeContent: top.getBoundingClientRect().top < content.getBoundingClientRect().top,
      noOldSidebar:!d.querySelector('.jlwa-ui-sidebar,.jlwa-ui-sidebar-overlay'),
      appWidth: Math.round(app.getBoundingClientRect().width),
      appScrollWidth: app.scrollWidth,
      appClientWidth: app.clientWidth,
      activeLink:!!nav.querySelector('[aria-current="page"]'),
      visible:win.getComputedStyle(top).display !== 'none'
    };
    out.textContent=JSON.stringify(results,null,2);
    out.setAttribute('data-pass',String(results.navCount===8 && results.navScrolls && results.topBeforeContent && results.noOldSidebar && results.activeLink && results.visible && results.appScrollWidth<=results.appClientWidth+3));
  }catch(error){out.textContent=String(error);}
}
frame.addEventListener('load',()=>setTimeout(verify,1100));
</script>
</body></html>

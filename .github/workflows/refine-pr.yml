name: Verify unified plugin PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply refinement in test workspace
        run: python3 .refactor/refine.py
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find . -path './.git' -prune -o -name '*.php' -print0)
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -path './.git' -prune -o -name '*.js' -print0)
      - name: Frontend bootstrap smoke test
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/jlwa-smoke.php <<'PHP'
          <?php
          define('ABSPATH', __DIR__ . '/');
          function plugin_dir_path($file){ return rtrim(dirname($file), '/\\') . '/'; }
          function plugin_dir_url($file){ return 'https://example.test/wp-content/plugins/wp-assistant/'; }
          function plugin_basename($file){ return 'wp-assistant/jiuliu-wp-assistant.php'; }
          function is_admin(){ return false; }
          function add_action(){ return true; }
          function add_filter(){ return true; }
          function add_shortcode(){ return true; }
          function register_activation_hook(){ return true; }
          function get_option($key,$default=array()){ return $default; }
          function get_site_option($key,$default=array()){ return $default; }
          function is_multisite(){ return false; }
          function load_plugin_textdomain(){ return true; }
          require getcwd() . '/jiuliu-wp-assistant.php';
          foreach (array('JLWA_Feature_Registry','JLWA_Page_Effects_Feature','JLWA_AI_Summary_Feature','JLWA_Immersive_Preloader_Feature','JLWA_Media_Urls_Feature') as $class) {
              if (!class_exists($class)) { throw new RuntimeException('Missing class: ' . $class); }
          }
          if (count(JLWA_Feature_Registry::statuses()) !== 4) { throw new RuntimeException('Feature registry incomplete'); }
          echo "bootstrap ok\n";
          PHP
          php /tmp/jlwa-smoke.php
      - name: Architecture assertions
        shell: bash
        run: |
          set -euo pipefail
          test ! -e modules
          test ! -e includes/class-jlwa-module-loader.php
          plugin_headers=$(grep -R --include='*.php' -l '^[[:space:]]*\*[[:space:]]*Plugin Name:' . --exclude-dir=.git | wc -l | tr -d ' ')
          test "$plugin_headers" = "1"
          activation_hooks=$(grep -R --include='*.php' -h 'register_activation_hook[[:space:]]*(' . --exclude-dir=.git | wc -l | tr -d ' ')
          test "$activation_hooks" = "1"
          if grep -R --include='*.php' -n "add_action( 'admin_menu'" features; then exit 1; fi
          if grep -R --include='*.php' -nE 'add_(menu|submenu)_page[[:space:]]*\(' features; then exit 1; fi
          if grep -R --include='*.php' -n 'plugin_action_links_' features; then exit 1; fi
          if grep -R --include='*.php' -nE '\b(XJPE_Plugin|WPAIAS_Plugin|Jiuliu_Immersive_Preloader|Jiuliu_Relative_Media_Urls)\b' . --exclude-dir=.git; then exit 1; fi

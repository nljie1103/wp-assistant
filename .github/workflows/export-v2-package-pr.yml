name: Export wp-assistant v2 package artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WordPress install package
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -R --include='*.php' -l '^[[:space:]]*\* Plugin Name:' . | wc -l)" -eq 1
          test "$(grep -R --include='*.php' -h 'register_activation_hook' . | wc -l)" -eq 1
          test ! -d modules
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find . -path './.git' -prune -o -name '*.php' -print0)
          while IFS= read -r -d '' file; do node --check "$file" >/dev/null; done < <(find . -path './.git' -prune -o -name '*.js' -print0)
          rm -rf "$RUNNER_TEMP/package"
          mkdir -p "$RUNNER_TEMP/package/wp-assistant"
          rsync -a ./ "$RUNNER_TEMP/package/wp-assistant/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.artifact-trigger' \
            --exclude='.refactor/' \
            --exclude='refactor-inventory.txt'
          (cd "$RUNNER_TEMP/package" && zip -qr "$GITHUB_WORKSPACE/jiuliu-wp-assistant-2.0.0.zip" wp-assistant)
          sha256sum jiuliu-wp-assistant-2.0.0.zip > jiuliu-wp-assistant-2.0.0.zip.sha256.txt
          unzip -t jiuliu-wp-assistant-2.0.0.zip >/dev/null
      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: jiuliu-wp-assistant-2.0.0
          path: |
            jiuliu-wp-assistant-2.0.0.zip
            jiuliu-wp-assistant-2.0.0.zip.sha256.txt
          if-no-files-found: error
          retention-days: 1

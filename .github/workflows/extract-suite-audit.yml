name: Extract suite audit summaries

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/extract-suite-audit.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract concise reports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('.suite-audit/report.json').read_text(encoding='utf-8'))
          Path('.suite-audit/comparison.json').write_text(json.dumps(report['comparison'], ensure_ascii=False, indent=2), encoding='utf-8')
          Path('.suite-audit/security.json').write_text(json.dumps(report['security_scan'], ensure_ascii=False, indent=2), encoding='utf-8')
          summaries = {}
          for repo, data in report['repositories'].items():
              summaries[repo] = {
                  'headers': data.get('headers', []),
                  'file_count': len(data.get('files', {})),
              }
          Path('.suite-audit/repositories.json').write_text(json.dumps(summaries, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .suite-audit/comparison.json .suite-audit/security.json .suite-audit/repositories.json
          git commit -m 'chore: extract concise suite audit summaries'
          git push origin HEAD:main

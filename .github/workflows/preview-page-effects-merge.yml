name: Preview page effects three-way merge

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/preview-page-effects-merge.yml'

permissions:
  contents: write

jobs:
  merge-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build three-way merge preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wp-page-effects .suite-audit/merge-preview
          git clone https://github.com/nljie1103/wp-page-effects.git /tmp/wp-page-effects
          mkdir -p .suite-audit/merge-preview
          : > .suite-audit/merge-preview/status.txt
          base=9e0ea1106ad78064a6e3c461314462e9b4011fbd
          for file in assets/css/admin.css assets/js/admin.js assets/js/frontend.js uninstall.php wp-page-effects.php; do
            mkdir -p ".suite-audit/merge-preview/$(dirname "$file")" /tmp/merge-base/"$(dirname "$file")" /tmp/merge-theirs/"$(dirname "$file")"
            git -C /tmp/wp-page-effects show "${base}:${file}" > "/tmp/merge-base/${file}"
            cp "/tmp/wp-page-effects/${file}" "/tmp/merge-theirs/${file}"
            set +e
            git merge-file -p "modules/page-effects/${file}" "/tmp/merge-base/${file}" "/tmp/merge-theirs/${file}" > ".suite-audit/merge-preview/${file}"
            code=$?
            set -e
            echo "${file}: ${code}" >> .suite-audit/merge-preview/status.txt
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .suite-audit/merge-preview
          git commit -m 'chore: preview page effects 1.6.0 merge'
          git push origin HEAD:main

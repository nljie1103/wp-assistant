name: Apply admin UI 2.0.1

on:
  push:
    branches:
      - fix/admin-ui-2.0.1
    paths:
      - '.github/workflows/apply-admin-ui-201.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-ui-2.0.1
          fetch-depth: 0
      - name: Apply integration patch
        run: python3 .ui-fix/apply.py
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: find assets features -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Architecture and asset assertions
        run: |
          test "$(grep -R --include='*.php' -h 'Plugin Name:' . | wc -l)" -eq 1
          test "$(grep -R --include='*.php' -h 'register_activation_hook' . | wc -l)" -eq 1
          grep -q "JLWA_VERSION', '2.0.1'" jiuliu-wp-assistant.php
          grep -q "enqueue_feature_assets" includes/class-jlwa-admin.php
          grep -q "admin-content.css" includes/class-jlwa-admin.php
          grep -q "admin-content.js" includes/class-jlwa-admin.php
          test -f assets/css/admin-content.css
          test -f assets/js/admin-content.js
          ! grep -R "dis: block" assets/css/admin-content.css
      - name: Commit verified release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: rebuild unified admin content UI for 2.0.1'
          git push origin HEAD:fix/admin-ui-2.0.1

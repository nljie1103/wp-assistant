name: Publish 九流WP助手 Release

on:
  push:
    branches: [main]
    paths:
      - jiuliu-wp-assistant.php
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jlwa-official-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Full release gate on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpunit:9.6
          extensions: mbstring, dom, xml
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash tools/check.sh

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: phpunit:9.6
          extensions: mbstring, dom, xml
          coverage: none
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify code quality before publishing
        run: bash tools/check.sh
      - name: Resolve and cross-check release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/^ \* Version: \([0-9][0-9.]*\)$/\1/p" jiuliu-wp-assistant.php | head -n1)
          test -n "$VERSION"
          grep -Fq "define( 'JLWA_VERSION', '$VERSION' );" jiuliu-wp-assistant.php
          grep -Fxq "Stable tag: $VERSION" readme.txt
          test -f "RELEASE_NOTES_$VERSION.md"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Enforce immutable version and Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Published assets are immutable; increment the version."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            PREVIOUS_COMMIT=$(git rev-list -n1 "$TAG")
            if [ "$PREVIOUS_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG points to a different commit. Never replace an existing version."
              exit 1
            fi
          fi
      - name: Build exact-commit installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="$RUNNER_TEMP/jlwa-build"
          ROOT="$BUILD/jiuliu-wp-assistant"
          rm -rf "$BUILD"
          mkdir -p "$ROOT"
          rsync -a ./ "$ROOT/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'tools/' \
            --exclude 'tests/' \
            --exclude 'phpunit.xml.dist' \
            --exclude 'RELEASE_NOTES_*.md'
          cd "$BUILD"
          zip -qr "$GITHUB_WORKSPACE/jiuliu-wp-assistant-$VERSION.zip" jiuliu-wp-assistant
          cd "$GITHUB_WORKSPACE"
          sha256sum "jiuliu-wp-assistant-$VERSION.zip" > "jiuliu-wp-assistant-$VERSION.zip.sha256.txt"
          unzip -t "jiuliu-wp-assistant-$VERSION.zip" >/dev/null
          unzip -Z1 "jiuliu-wp-assistant-$VERSION.zip" | grep -Fxq 'jiuliu-wp-assistant/jiuliu-wp-assistant.php'
      - name: Publish tagged immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP="jiuliu-wp-assistant-$VERSION.zip"
          SHA="$ZIP.sha256.txt"
          NOTES="RELEASE_NOTES_$VERSION.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            git tag -a "$TAG" -m "九流WP助手 $VERSION" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
          gh release create "$TAG" "$ZIP" "$SHA" \
            --title "九流WP助手 $VERSION" --notes-file "$NOTES" --latest

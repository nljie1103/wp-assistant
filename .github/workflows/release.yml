name: Publish 九流WP助手 2.5.1

on:
  push:
    branches:
      - main
    paths:
      - tools/finalize-2.5.1.py
      - tools/release-2.5.1/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jlwa-official-release-2.5.1
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply 2.5.1 source update
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/finalize-2.5.1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: 九流WP助手 2.5.1 修复摘要并恢复完整下载页"
          git push origin HEAD:main

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/^ \* Version: \([0-9][0-9.]*\)$/\1/p" jiuliu-wp-assistant.php | head -n1)
          test "$VERSION" = "2.5.1"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate changed PHP and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          php -l features/download-page.php
          php -l features/download-page-templates/technology.php
          php -l features/download-page-templates/business.php
          php -l features/download-page-templates/vip.php
          php -l features/ai-article-summary/includes/class-wpaias-frontend.php
          php -l features/ai-article-summary/bootstrap.php
          node --check features/ai-article-summary/assets/js/frontend.js

      - name: Build installable package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="$RUNNER_TEMP/jlwa-build"
          ROOT="$BUILD/jiuliu-wp-assistant"
          rm -rf "$BUILD"
          mkdir -p "$ROOT"
          rsync -a ./ "$ROOT/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'tools/' \
            --exclude 'RELEASE_NOTES_*.md'
          cd "$BUILD"
          zip -qr "$GITHUB_WORKSPACE/jiuliu-wp-assistant-$VERSION.zip" jiuliu-wp-assistant
          cd "$GITHUB_WORKSPACE"
          sha256sum "jiuliu-wp-assistant-$VERSION.zip" > "jiuliu-wp-assistant-$VERSION.zip.sha256.txt"
          unzip -t "jiuliu-wp-assistant-$VERSION.zip"
          test -f "$ROOT/features/download-page-templates/technology.php"
          test -f "$ROOT/features/download-page-templates/business.php"
          test -f "$ROOT/features/download-page-templates/vip.php"
          grep -q "Version: 2.5.1" "$ROOT/jiuliu-wp-assistant.php"

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          ZIP="jiuliu-wp-assistant-$VERSION.zip"
          SHA="$ZIP.sha256.txt"
          NOTES="RELEASE_NOTES_$VERSION.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --tags
          git checkout main
          git reset --hard origin/main
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "九流WP助手 $VERSION"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$SHA" --clobber
          else
            gh release create "$TAG" "$ZIP" "$SHA" \
              --title "九流WP助手 $VERSION" \
              --notes-file "$NOTES" \
              --latest
          fi

name: Publish 九流WP助手 Release

on:
  push:
    branches:
      - main
    paths:
      - jiuliu-wp-assistant.php
      - features/page-effects/admin-save-fix.php
      - features/ai-article-summary/bootstrap.php
      - features/ai-article-summary/includes/animation-fix.php
      - features/ai-article-summary/assets/js/animation-fix.js
      - features/ai-article-summary/assets/css/animation-fix.css
      - RELEASE_NOTES_*.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jlwa-official-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/^ \* Version: \([0-9][0-9.]*\)$/\1/p" jiuliu-wp-assistant.php | head -n1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate changed files
        shell: bash
        run: |
          set -euo pipefail
          php -l jiuliu-wp-assistant.php
          php -l features/page-effects/admin-save-fix.php
          php -l features/ai-article-summary/bootstrap.php
          php -l features/ai-article-summary/includes/animation-fix.php
          node --check features/ai-article-summary/assets/js/animation-fix.js

      - name: Build installable package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="$RUNNER_TEMP/jlwa-build"
          ROOT="$BUILD/jiuliu-wp-assistant"
          rm -rf "$BUILD"
          mkdir -p "$ROOT"
          rsync -a ./ "$ROOT/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'tools/' \
            --exclude 'RELEASE_NOTES_*.md'
          cd "$BUILD"
          zip -qr "$GITHUB_WORKSPACE/jiuliu-wp-assistant-$VERSION.zip" jiuliu-wp-assistant
          cd "$GITHUB_WORKSPACE"
          sha256sum "jiuliu-wp-assistant-$VERSION.zip" > "jiuliu-wp-assistant-$VERSION.zip.sha256.txt"
          unzip -t "jiuliu-wp-assistant-$VERSION.zip" >/dev/null

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          ZIP="jiuliu-wp-assistant-$VERSION.zip"
          SHA="$ZIP.sha256.txt"
          NOTES="RELEASE_NOTES_$VERSION.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --tags
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "九流WP助手 $VERSION" origin/main
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$SHA" --clobber
          elif test -f "$NOTES"; then
            gh release create "$TAG" "$ZIP" "$SHA" --title "九流WP助手 $VERSION" --notes-file "$NOTES" --latest
          else
            gh release create "$TAG" "$ZIP" "$SHA" --title "九流WP助手 $VERSION" --generate-notes --latest
          fi

name: Refine unified plugin 2.0

on:
  push:
    branches:
      - refactor/unified-plugin-2.0
    paths:
      - '.github/workflows/refine-unified-v2.yml'

permissions:
  contents: write

jobs:
  refine-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove residual standalone admin code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def remove_method(path, method):
              path = Path(path)
              text = path.read_text(encoding='utf-8')
              rx = re.compile(r'(?:(?:public|protected|private)\s+)?(?:static\s+)?function\s+' + re.escape(method) + r'\s*\([^)]*\)\s*\{')
              match = rx.search(text)
              if not match:
                  raise RuntimeError(f'method not found: {path}:{method}')
              start = match.start()
              prefix = text[:start]
              doc_start = prefix.rfind('/**')
              doc_end = prefix.rfind('*/')
              if doc_start >= 0 and doc_end >= doc_start and not prefix[doc_end + 2:].strip():
                  start = doc_start
              open_pos = text.find('{', match.start(), match.end())
              depth = 0
              state = 'normal'
              i = open_pos
              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ''
                  if state == 'normal':
                      if ch == "'": state = 'single'
                      elif ch == '"': state = 'double'
                      elif ch == '/' and nxt == '/': state = 'line'; i += 1
                      elif ch == '#': state = 'line'
                      elif ch == '/' and nxt == '*': state = 'block'; i += 1
                      elif ch == '{': depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              while end < len(text) and text[end] in ' \t\r\n': end += 1
                              path.write_text(text[:start] + text[end:], encoding='utf-8')
                              return
                  elif state == 'single':
                      if ch == '\\': i += 1
                      elif ch == "'": state = 'normal'
                  elif state == 'double':
                      if ch == '\\': i += 1
                      elif ch == '"': state = 'normal'
                  elif state == 'line':
                      if ch == '\n': state = 'normal'
                  elif state == 'block':
                      if ch == '*' and nxt == '/': state = 'normal'; i += 1
                  i += 1
              raise RuntimeError(f'unclosed method: {path}:{method}')

          admin = Path('includes/class-jlwa-admin.php')
          text = admin.read_text(encoding='utf-8')
          text = text.replace(
              "\t\tadd_action( 'admin_menu', array( $this, 'register_menus' ), 20 );\n",
              "\t\tadd_action( 'admin_menu', array( $this, 'register_menus' ), 20 );\n\t\tadd_action( 'admin_menu', array( $this, 'rename_dashboard_submenu' ), 999 );\n",
              1,
          )
          duplicate = """\t\tadd_submenu_page(\n\t\t\tJLWA_MENU_SLUG,\n\t\t\t'助手总览',\n\t\t\t'助手总览',\n\t\t\t'manage_options',\n\t\t\tJLWA_MENU_SLUG,\n\t\t\tarray( $this, 'render_dashboard' )\n\t\t);\n"""
          if duplicate not in text:
              raise RuntimeError('dashboard submenu block not found')
          text = text.replace(duplicate, '', 1)
          marker = "\n\t/** @param string $key Feature key. @return array<int,mixed> */\n\tprotected function feature_callback"
          method = """
\t/** Rename WordPress' automatic first submenu. */
\tpublic function rename_dashboard_submenu() {
\t\tglobal $submenu;
\t\tif ( isset( $submenu[ JLWA_MENU_SLUG ][0][0] ) ) {
\t\t\t$submenu[ JLWA_MENU_SLUG ][0][0] = '助手总览';
\t\t}
\t}
"""
          if marker not in text:
              raise RuntimeError('admin insertion marker not found')
          text = text.replace(marker, method + marker, 1)
          admin.write_text(text, encoding='utf-8')

          page = Path('features/page-effects/bootstrap.php')
          ptext = page.read_text(encoding='utf-8').replace("            set_transient( 'xjpe_activated_notice', 1, 60 );\n", '')
          page.write_text(ptext, encoding='utf-8')
          for method_name in ('add_admin_menu', 'activation_notice', 'plugin_action_links'):
              remove_method(page, method_name)

          ai = Path('features/ai-article-summary/includes/class-wpaias-admin.php')
          atext = ai.read_text(encoding='utf-8').replace("\n\t\t// 插件页操作链接。\n", "\n")
          ai.write_text(atext, encoding='utf-8')
          for method_name in ('plugin_action_links', 'add_menu'):
              remove_method(ai, method_name)

          pre = Path('features/immersive-preloader/includes/class-jip-admin.php')
          pre_text = pre.read_text(encoding='utf-8').replace("\t\tadd_action( 'admin_menu', array( $this, 'register_menu' ) );\n", '')
          pre.write_text(pre_text, encoding='utf-8')
          remove_method(pre, 'register_menu')

          media = Path('features/relative-media-urls/includes/class-jrmu-admin.php')
          media_text = media.read_text(encoding='utf-8').replace("\t\tadd_action( 'admin_menu', array( $this, 'add_admin_menu' ) );\n", '')
          media.write_text(media_text, encoding='utf-8')
          remove_method(media, 'add_admin_menu')

          workflow = Path('.github/workflows/refine-unified-v2.yml')
          if workflow.exists(): workflow.unlink()
          for directory in (Path('.github/workflows'), Path('.github')):
              if directory.exists() and not any(directory.iterdir()): directory.rmdir()
          PY

      - name: PHP and JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find . -path './.git' -prune -o -name '*.php' -print0)
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -path './.git' -prune -o -name '*.js' -print0)

      - name: Runtime bootstrap smoke tests
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/jlwa-smoke.php <<'PHP'
          <?php
          define('ABSPATH', __DIR__ . '/');
          function plugin_dir_path($file){ return rtrim(dirname($file), '/\\') . '/'; }
          function plugin_dir_url($file){ return 'https://example.test/wp-content/plugins/wp-assistant/' . (strpos($file, '/features/') !== false ? trim(substr(dirname($file), strpos(dirname($file), '/features/') + 1), '/') . '/' : ''); }
          function plugin_basename($file){ return 'wp-assistant/jiuliu-wp-assistant.php'; }
          function is_admin(){ return false; }
          function add_action(){ return true; }
          function add_filter(){ return true; }
          function add_shortcode(){ return true; }
          function register_activation_hook(){ return true; }
          function get_option($key,$default=array()){ return $default; }
          function get_site_option($key,$default=array()){ return $default; }
          function is_multisite(){ return false; }
          function load_plugin_textdomain(){ return true; }
          require getcwd() . '/jiuliu-wp-assistant.php';
          foreach (array('JLWA_Feature_Registry','JLWA_Page_Effects_Feature','JLWA_AI_Summary_Feature','JLWA_Immersive_Preloader_Feature','JLWA_Media_Urls_Feature') as $class) {
              if (!class_exists($class)) { throw new RuntimeException('Missing class: ' . $class); }
          }
          if (count(JLWA_Feature_Registry::statuses()) !== 4) { throw new RuntimeException('Feature registry incomplete'); }
          echo "frontend bootstrap ok\n";
          PHP
          php /tmp/jlwa-smoke.php

      - name: Architecture assertions
        shell: bash
        run: |
          set -euo pipefail
          test ! -e modules
          test ! -e includes/class-jlwa-module-loader.php
          test ! -e .refactor
          plugin_headers=$(grep -R --include='*.php' -l '^[[:space:]]*\*[[:space:]]*Plugin Name:' . --exclude-dir=.git | wc -l | tr -d ' ')
          test "$plugin_headers" = "1"
          activation_hooks=$(grep -R --include='*.php' -h 'register_activation_hook[[:space:]]*(' . --exclude-dir=.git | wc -l | tr -d ' ')
          test "$activation_hooks" = "1"
          if grep -R --include='*.php' -n "add_action( 'admin_menu'" features; then exit 1; fi
          if grep -R --include='*.php' -nE 'add_(menu|submenu)_page[[:space:]]*\(' features; then exit 1; fi
          if grep -R --include='*.php' -n 'plugin_action_links_' features; then exit 1; fi
          if grep -R --include='*.php' -nE '\b(XJPE_Plugin|WPAIAS_Plugin|Jiuliu_Immersive_Preloader|Jiuliu_Relative_Media_Urls)\b' . --exclude-dir=.git; then exit 1; fi
          if grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' . --exclude-dir=.git; then exit 1; fi

      - name: Commit refinements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: remove residual standalone plugin code'
          git push origin HEAD:refactor/unified-plugin-2.0

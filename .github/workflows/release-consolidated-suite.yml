name: Release consolidated suite 1.0.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-consolidated-suite.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout suite
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch page effects history
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wp-page-effects /tmp/jlwa-base /tmp/jlwa-merged
          git clone https://github.com/nljie1103/wp-page-effects.git /tmp/wp-page-effects

      - name: Apply audited module consolidation
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .release/patch_modules.py.gz.b64 | gzip --decompress > /tmp/jlwa-patch-modules.py
          echo '52def41570da91083d8a31191757b556ca2e3b18eae98d99f618fc7d709150c4  /tmp/jlwa-patch-modules.py' | sha256sum --check
          python3 /tmp/jlwa-patch-modules.py

      - name: Validate PHP and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find . -path './.git' -prune -o -name '*.php' -print0)
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -path './.git' -prune -o -name '*.js' -print0)
          git diff --check
          test ! -d .suite-audit
          test ! -d .release
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git .
          grep -q 'Version: 1.0.0' jiuliu-wp-assistant.php
          grep -q 'Version: 1.6.0' modules/page-effects/wp-page-effects.php
          grep -q 'wpaias_public_generation_rate_limit' modules/ai-article-summary/includes/class-wpaias-frontend.php
          grep -q "show-when-effect" modules/immersive-preloader/assets/js/admin.js
          ! grep -q 'XJPE_Updater' modules/page-effects/wp-page-effects.php

      - name: Commit consolidated release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: consolidate plugins into wp-assistant 1.0.0'
          git push origin HEAD:main

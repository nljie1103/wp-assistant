name: Inventory legacy architecture

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-inventory.yml'

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build architecture inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('.')]
          out = []
          out.append('=== FILE TREE ===\n')
          for p in sorted(Path('.').rglob('*')):
              if not p.is_file() or '.git' in p.parts or p.as_posix() == '.github/workflows/refactor-inventory.yml':
                  continue
              out.append(p.as_posix() + '\n')

          patterns = {
              'plugin_headers': r'Plugin Name:',
              'old_classes': r'\b(?:XJPE|JIP|JRMU|WPAIAS)_[A-Za-z0-9_]+',
              'old_constants': r'\b(?:XJPE|JIP|JRMU|WPAIAS)_[A-Z0-9_]+',
              'admin_menus': r'add_(?:menu|submenu)_page\s*\(',
              'register_activation': r'register_activation_hook\s*\(',
              'settings_options': r'(?:get|update|add|delete)_option\s*\(',
              'asset_handles': r'wp_enqueue_(?:style|script)\s*\(',
          }
          for title, pattern in patterns.items():
              out.append(f'\n=== {title.upper()} ===\n')
              rx = re.compile(pattern)
              for p in sorted(Path('.').rglob('*')):
                  if not p.is_file() or p.suffix.lower() not in {'.php','.js','.css'} or '.git' in p.parts:
                      continue
                  text = p.read_text(encoding='utf-8', errors='replace')
                  for n, line in enumerate(text.splitlines(), 1):
                      if rx.search(line):
                          out.append(f'{p.as_posix()}:{n}: {line.strip()}\n')

          Path('refactor-inventory.txt').write_text(''.join(out), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add refactor-inventory.txt
          git commit -m 'chore: record legacy architecture inventory'
          git push origin HEAD:main

name: Publish 九流WP助手 2.5.4 Direct

on:
  issues:
    types:
      - opened
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[release] 九流WP助手 2.5.4'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate 2.5.4 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n "s/^ \* Version: \([0-9][0-9.]*\)$/\1/p" jiuliu-wp-assistant.php | head -n1)" = "2.5.4"
          php -l jiuliu-wp-assistant.php
          php -l features/download-page-cover-fix.php
          node --check assets/js/download-page-cover-fix.js

      - name: Build installable package
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/jlwa-254-build"
          ROOT="$BUILD/jiuliu-wp-assistant"
          rm -rf "$BUILD"
          mkdir -p "$ROOT"
          rsync -a ./ "$ROOT/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'tools/' \
            --exclude 'RELEASE_NOTES_*.md'
          cd "$BUILD"
          zip -qr "$GITHUB_WORKSPACE/jiuliu-wp-assistant-2.5.4.zip" jiuliu-wp-assistant
          cd "$GITHUB_WORKSPACE"
          sha256sum jiuliu-wp-assistant-2.5.4.zip > jiuliu-wp-assistant-2.5.4.zip.sha256.txt
          unzip -t jiuliu-wp-assistant-2.5.4.zip >/dev/null

      - name: Create or update v2.5.4 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --tags
          if ! git rev-parse v2.5.4 >/dev/null 2>&1; then
            git tag -a v2.5.4 -m "九流WP助手 2.5.4" origin/main
            git push origin v2.5.4
          fi
          if gh release view v2.5.4 >/dev/null 2>&1; then
            gh release upload v2.5.4 jiuliu-wp-assistant-2.5.4.zip jiuliu-wp-assistant-2.5.4.zip.sha256.txt --clobber
            gh release edit v2.5.4 --title "九流WP助手 2.5.4" --notes-file RELEASE_NOTES_2.5.4.md --latest
          else
            gh release create v2.5.4 jiuliu-wp-assistant-2.5.4.zip jiuliu-wp-assistant-2.5.4.zip.sha256.txt --title "九流WP助手 2.5.4" --notes-file RELEASE_NOTES_2.5.4.md --latest
          fi
